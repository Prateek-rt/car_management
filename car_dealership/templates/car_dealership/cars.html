<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartAuto - Car Listings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    /* Sidebar */
    aside {
      width: 250px;
      background: rgba(0, 0, 0, 0.4);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      backdrop-filter: blur(8px);
    }

    aside input[type="text"] {
      width: 90%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    aside a {
      font-size: 16px;
      color: #fff;
      transition: color 0.3s;
    }

    aside a:hover {
      color: #ff7f50;
    }

    /* Layout */
    .container {
      display: flex;
    }

    .main-content {
      flex: 1;
      padding: 40px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      width: 100%;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .car-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      height: 100%;
    }

    .car-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .car-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .car-card h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .car-card p {
      margin: 5px 0;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #ff7f50;
      color: #fff;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #e56c3d;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #ccc;
      font-size: 14px;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      aside {
        display: none;
      }

      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Sidebar -->
    <aside>
      <div style="font-size: 28px; font-weight: bold; color: #ff7f50; margin-bottom: 20px;">SmartAuto</div>
      
      <form method="GET" action="#">
        <input type="text" name="search" placeholder="Search...">
      </form>

      <a href="{% url 'index' %}" style="color: {% if request.path == '/' %}#ff7f50{% else %}#fff{% endif %};">Home</a>
      <a href="{% url 'car_list' %}" style="color: {% if request.path == '/cars/' %}#ff7f50{% else %}#fff{% endif %};">Cars</a>
      <a href="{% url 'add_car' %}" style="color: {% if request.path == '/add_car/' %}#ff7f50{% else %}#fff{% endif %};">Add Car</a>
      <a href="{% url 'customer_list' %}">Customer List</a>
      <a href="{% url 'add_customer' %}" style="color: {% if request.path == '/add_customer/' %}#ff7f50{% else %}#fff{% endif %};">Add Customer</a>
      <a href="{% url 'worker_list' %}" style="color:#fff; text-decoration:none; font-size:16px;">Workers</a>
    </aside>

    <!-- Main Content -->
    <div class="main-content">

      <!-- Car Listings -->
      <div class="grid">
        {% for car in cars %}
        <div class="car-card">
          <img src="{{ car.image.url }}" alt="{{ car.name }}">
          <h2>{{ car.name }}</h2>
          <p>Model: {{ car.model }}</p>
          <p>Price: {{ car.price }}</p>
          <p>Mileage: {{ car.mileage }}</p>
          <a href="{% url 'car_detail' car.pk %}" class="btn">View Details</a>

        </div>
        {% endfor %}
      </div>

      <!-- Footer -->
      <footer>
        &copy; 2025 SmartAuto Dealership. All rights reserved.
      </footer>

    </div>
  </div>
</body>
</html>
