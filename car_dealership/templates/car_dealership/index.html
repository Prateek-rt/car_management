<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SmartAuto Dealership</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(to right, #0f2027, #203a43, #2c5364); color:#fff; min-height:100vh; display:flex;">

 <!-- Sidebar Navigation -->
 <aside style="width:250px; background:rgba(0,0,0,0.4); padding:30px 20px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; backdrop-filter:blur(8px);">
  <div style="font-size:28px; font-weight:bold; color:#ff7f50; margin-bottom:20px;">SmartAuto</div>

  <!-- Smaller Search Box -->
  <form method="GET" action="#" style="margin-bottom:10px;">
    <input 
      type="text" 
      name="search" 
      placeholder="Search..." 
      style="width:90%; padding:8px 12px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff; font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,0.2); outline:none;" />
  </form>

  <a href="{% url 'index' %}" style="color:{% if request.path == '/' %}#ff7f50{% else %}#fff{% endif %}; text-decoration:none; font-size:16px;">Home</a>
  <a href="{% url 'car_list' %}" style="color:{% if request.path == '/cars/' %}#ff7f50{% else %}#fff{% endif %}; text-decoration:none; font-size:16px;">Cars</a>
  <a href="{% url 'add_car' %}" style="color:{% if request.path == '/add_car/' %}#ff7f50{% else %}#fff{% endif %}; text-decoration:none; font-size:16px;">Add Car</a>
  <a href="{% url 'customer_list' %}" style="color:#fff; text-decoration:none; font-size:16px;">Customer List</a>
  <a href="{% url 'add_customer' %}" style="color:{% if request.path == '/add_customer/' %}#ff7f50{% else %}#fff{% endif %}; text-decoration:none; font-size:16px;">Add Customer</a>
  <a href="#" style="color:#fff; text-decoration:none; font-size:16px;">Contact</a>
</aside>


  <!-- Main Content Area -->
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:40px 20px;">
    <div style="background:rgba(255,255,255,0.08); border-radius:20px; padding:60px 30px; text-align:center; width:90%; max-width:700px; box-shadow:0 8px 32px rgba(0,0,0,0.37); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.18);">
      <h1 style="font-size:48px; margin-bottom:10px;">Welcome to SmartAuto</h1>
      <p style="font-size:20px; color:#ddd; margin-bottom:40px;">Your trusted car dealership management system</p>
      <div>
        <a href="{% url 'car_list' %}" style="display:inline-block; margin:10px; padding:14px 28px; font-size:18px; text-decoration:none; border-radius:8px; border:2px solid #fff; color:#fff;">Explore Cars</a>
        <a href="#" style="display:inline-block; margin:10px; padding:14px 28px; font-size:18px; text-decoration:none; border-radius:8px; border:2px solid #fff; color:#fff;">Contact Us</a>
      </div>
    </div>
    <!-- Footer -->
    <footer style="text-align:center; padding:20px; color:#ccc; font-size:14px; margin-top:40px;">
      &copy; 2025 SmartAuto Dealership. All rights reserved.
    </footer>
  </div>

</body>
</html>
