<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ car.name }} - Details</title>
  <style>
    body {
      background: #2c3e50;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #ff7f50;
    }

    p {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff7f50;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }

    .back-link:hover {
      background: #e56c3d;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="{{ car.image.url }}" alt="{{ car.name }}">
    <h1>{{ car.name }}</h1>
    <p><strong>Model:</strong> {{ car.model }}</p>
    <p><strong>Price:</strong> {{ car.price }}</p>
    <p><strong>Mileage:</strong> {{ car.mileage }}</p>
    <a href="{% url 'car_list' %}" class="back-link">← Back to Listings</a>
  </div>
</body>
</html>
