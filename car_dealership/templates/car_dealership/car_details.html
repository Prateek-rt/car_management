<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ car.name }} - Details</title>
</head>
<body style="margin:0; font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif; background:linear-gradient(to right,#0f2027,#203a43,#2c5364); color:#fff; box-sizing:border-box; overflow-x:hidden;">

  <!-- Navbar -->
  <nav style="width:100%; background:rgba(0,0,0,0.4); padding:15px 30px; display:flex; align-items:center; gap:40px; position:sticky; top:0; backdrop-filter:blur(8px); z-index:999;">
    <div style="font-size:28px; font-weight:bold; color:#ff7f50;">SmartAuto</div>
    <ul style="display:flex; gap:25px; list-style:none; margin:0; padding:0;">
      <li><a href="{% url 'index' %}" style="color:#fff; text-decoration:none; font-size:16px;">Home</a></li>
      <li><a href="{% url 'car_list' %}" style="color:#ff7f50; text-decoration:none; font-size:16px;">Cars</a></li>
     <a href="{% url 'customer_list' %}" style="color:#fff;">Customer List</a>
      <li><a href="{% url 'add_car' %}" style="color:#fff; text-decoration:none; font-size:16px;">Add Car</a></li>
      <li><a href="#" style="color:#fff; text-decoration:none; font-size:16px;">Contact</a></li>
    </ul>
  </nav>

  <!-- Car Detail Section -->
  <div style="max-width:900px; margin:60px auto; padding:30px; background:rgba(255,255,255,0.1); border-radius:20px; box-shadow:0 8px 32px rgba(0,0,0,0.37); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.2);">
    <div style="display:flex; flex-wrap:wrap; gap:30px; align-items:center; justify-content:center;">
      <img src="{{ car.image.url }}" alt="{{ car.name }}" style="width:100%; max-width:400px; height:auto; border-radius:15px;">
      <div style="flex:1; min-width:250px;">
        <h1 style="font-size:32px; margin-bottom:20px;">{{ car.name }}</h1>
        <p style="margin:10px 0; font-size:18px;"><strong>Model:</strong> {{ car.model }}</p>
        <p style="margin:10px 0; font-size:18px;"><strong>Price:</strong> {{ car.price }}</p>
        <p style="margin:10px 0; font-size:18px;"><strong>Mileage:</strong> {{ car.mileage }}</p>
        <a href="{% url 'car_list' %}" style="display:inline-block; margin-top:20px; padding:10px 25px; background:#ff7f50; color:white; text-decoration:none; border-radius:8px;">Back to Listings</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer style="text-align:center; padding:20px; color:#ccc; font-size:14px;">
    &copy; 2025 SmartAuto Dealership. All rights reserved.
  </footer>

</body>
</html>
